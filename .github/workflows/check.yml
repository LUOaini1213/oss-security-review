name: check

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly: the cited commits must stay on their repositories' default branches
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: counts.json is what the committed reports give
        run: python scripts/counts.py --base results/raw --check
      - name: README and findings numbers match counts.json
        run: python scripts/verify_readme.py
      - name: cited commits are on their default branches
        if: matrix.os == 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/verify_readme.py --online
      - name: tests (each check fails on a broken copy)
        run: python -m unittest discover -s tests -v
      - name: shell scripts parse
        if: matrix.os == 'ubuntu-latest'
        run: for f in scripts/*.sh; do bash -n "$f" || exit 1; done
